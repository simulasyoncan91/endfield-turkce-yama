name: Yazı veya yerleşim sorunu
description: Taşan yazı, eksik harf veya dinamik metin birleşimi bildirin.
title: "[Yerleşim] "
labels: []
body:
  - type: input
    id: versions
    attributes:
      label: Oyun ve yama sürümü
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Çözünürlük ve arayüz ölçeği
  - type: textarea
    id: location
    attributes:
      label: Ekran ve görünen sorun
      description: Varsa metin kimliğini ve sorunun hangi durumda oluştuğunu belirtin.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Ekran görüntüsü
      description: Kişisel bilgileri kaldırarak ekleyin.
    validations:
      required: true
