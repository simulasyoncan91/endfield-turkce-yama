name: Installer and catalog checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Discovery and updater tests
        shell: pwsh
        run: |
          ./tests/test_discovery.ps1
          ./tests/test_wrapper.ps1
          ./tests/test_process_guard.ps1
